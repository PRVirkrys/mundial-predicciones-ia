<div
  class="flex items-center gap-3 p-3 rounded-xl border transition-colors"
  [class]="isCurrentUser
    ? 'bg-primary/10 border-primary/30'
    : 'bg-base-100 border-base-200 hover:bg-base-200'"
>

  <span class="font-bold w-6 text-center text-sm"
    [class]="position === 1 ? 'text-warning' : 'text-base-content/40'"
  >#{{ position }}</span>

  <div class="avatar avatar-placeholder">
    <div class="w-10 rounded-full font-bold text-sm"
      [class]="isCurrentUser
        ? 'bg-primary text-primary-content'
        : position === 1
          ? 'bg-warning text-warning-content'
          : 'bg-base-300 text-base-content'"
    >
      {{ initials }}
    </div>
  </div>

  <div class="flex-1 min-w-0">
    <p class="font-semibold text-sm truncate">
      {{ user.name }}
      @if (isCurrentUser) {
        <span class="text-xs text-primary font-normal">(tú)</span>
      }
    </p>
    <p class="text-xs text-base-content/50">{{ user.totalScore }} puntos</p>
  </div>

  <div class="badge badge-sm font-bold"
    [class]="position === 1
      ? 'badge-warning'
      : isCurrentUser
        ? 'badge-primary'
        : 'badge-ghost'"
  >{{ user.totalScore }} pts</div>

</div>
